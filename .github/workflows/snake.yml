name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake game from GitHub contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ezequielranieri
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ffffff&color_dots=#0d1117,#21262d,#30363d,#8b949e,#e0e0e0
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#0d1117,#21262d,#30363d,#8b949e,#e0e0e0

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
